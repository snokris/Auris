<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Auris Studio{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/style.css">
{% block head %}{% endblock %}
</head>
<body>
<nav class="side-rail" aria-label="Main navigation">
  <a class="rail-brand" href="/" title="Auris Studio">A</a>
  <div class="rail-links">
    <a href="/" id="nav-library" class="rail-link{% if request.path == '/' %} active{% endif %}" title="Library" aria-label="Library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
    </a>
    <a href="/settings" id="nav-settings" class="rail-link{% if request.path == '/settings' %} active{% endif %}" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7.5" x2="20" y2="7.5"/><circle cx="9.5" cy="7.5" r="2.6"/><line x1="4" y1="16.5" x2="20" y2="16.5"/><circle cx="14.5" cy="16.5" r="2.6"/></svg>
    </a>
    <a href="/docs" id="nav-docs" class="rail-link{% if request.path == '/docs' %} active{% endif %}" title="Docs" aria-label="Docs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17.5H6.5A2.5 2.5 0 0 0 4 22z"/><line x1="8" y1="6.5" x2="16" y2="6.5"/></svg>
    </a>
  </div>
  <div class="rail-bottom">
    <span id="model-badge" class="badge badge-loading" title="TTS Loading">Loading</span>
  </div>
</nav>
{% block content %}{% endblock %}
<script>
(function applyTheme() {
  const raw = localStorage.getItem('theme') || 'light';
  const t = (raw === 'dark' || raw === 'night' || raw === 'amoled') ? 'dark' : 'light';
  if (t === 'dark') document.body.classList.add('theme-dark');
  localStorage.setItem('theme', t);
})();

async function pollModelStatus() {
  const badge = document.getElementById('model-badge');
  if (!badge) return;
  // Poll forever: the engine can regress from ready (server restart, engine
  // switch, unload for character analysis), so a frozen green dot would lie.
  let delay = 3000;
  try {
    const r = await fetch('/api/tts/status');
    const s = await r.json();
    badge.className = 'badge';
    badge.title = '';
    if (s.state === 'ready') {
      badge.textContent = 'TTS Ready';
      badge.classList.add('badge-ready');
      badge.title = 'TTS Ready';
      delay = 10000;  // relaxed heartbeat once ready
    } else if (s.state === 'loading') {
      badge.textContent = 'TTS Loading';
      badge.classList.add('badge-loading');
      badge.title = 'TTS Loading';
    } else if (s.state === 'error') {
      badge.textContent = 'TTS Error';
      badge.classList.add('badge-error');
      badge.title = 'TTS Error: ' + (s.message || '');
      delay = 10000;
    } else {
      badge.textContent = s.model_exists ? 'TTS Idle' : 'Model Missing';
      badge.classList.add(s.model_exists ? 'badge-idle' : 'badge-error');
      badge.title = badge.textContent;
    }
  } catch(e) { /* ignore */ }
  setTimeout(pollModelStatus, delay);
}
pollModelStatus();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
